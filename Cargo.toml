[package]
name = "predict"
version = "0.0.1"
edition = "2024"
# Let chains (1.88). The MSRV job checks it; raised only in a minor release.
rust-version = "1.88"
authors = ["Benjamin Lucier <benjaminlucier@gmail.com>"]
description = "Machine learning for Rust with a consistent, scikit-learn-style API."
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["machine-learning", "ml", "sklearn", "statistics", "prediction"]
categories = ["science", "algorithms"]
homepage = "https://predict.rs"
repository = "https://github.com/BenjaminLucier/predict"
# The book and CI stay in the repository; the package is the library, its
# tests and examples, the README and the licences.
exclude = ["/docs", "/.github"]

[dependencies]
ndarray = "0.17.2"
thiserror = "2"
# Randomness for generators, splitters and randomised estimators, behind
# `Seed`; no `rand` type is public. Default features are off to leave out the
# ChaCha generators, which we don't use; `sys_rng` seeds from the OS.
rand = { version = "0.10.3", default-features = false, features = ["std", "sys_rng"] }
# Sampling distributions (the normal distribution) for synthetic data and
# random initialisation.
rand_distr = { version = "0.6.0", default-features = false, features = ["std"] }
# Dense linear algebra (SVD for least squares), pure Rust and internal: no
# faer type is public. Default features are off to leave out rayon (no
# threads yet), sparse solvers, random matrices and .npy files.
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg"] }
