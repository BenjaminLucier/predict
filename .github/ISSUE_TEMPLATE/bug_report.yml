name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.0.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, and toolchain or runtime version (rustc, Node, browser).
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A minimal reproduction helps. Never paste tokens, keys or other secrets.
    validations:
      required: true
