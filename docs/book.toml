[book]
title = "predict"
authors = ["Benjamin Lucier"]
description = "Machine learning for Rust with a consistent, scikit-learn-style API."
language = "en"
src = "src"

[output.html]
site-url = "/"
git-repository-url = "https://github.com/benjaminlucier/predict"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.search]
enable = true

# The Rust Playground only has the most popular crates, not this one, so examples
# can't run there. Pages pull them in with `{{#rustdoc_include}}`, which hides
# the lines outside the anchor; the eye button shows the whole program.
[output.html.playground]
runnable = false

# Diagrams. `mermaid.min.js` and `mermaid-init.js` are generated by
# `mdbook-mermaid install docs`; re-run it after upgrading mdbook-mermaid.
[preprocessor.mermaid]
command = "mdbook-mermaid"

# Maths: `$...$` inline, `$$...$$` on its own line, rendered to HTML at build
# time (no JavaScript in the page). Runs after `links` so it also sees text
# pulled in with `{{#include}}`.
[preprocessor.katex]
after = ["links"]
