# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`.

[graph]
# A library builds for every target, so every target's dependencies count.
all-features = true

[advisories]
# Unmaintained crates and yanked versions fail too, not just vulnerabilities.
unmaintained = "all"
yanked = "deny"
ignore = [
    # paste is unmaintained (archived, finished). It's a proc macro that
    # faer's gemm uses at compile time only; nothing of it runs in predict.
    # Drop this once gemm moves off it.
    { id = "RUSTSEC-2024-0436", reason = "compile-time only, via faer's gemm" },
]

[licenses]
# Permissive licenses compatible with distributing under MIT OR Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions deep in the tree are upstream's to resolve.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
